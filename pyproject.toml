[project]
name = "nada-platform"
version = "0.1.0"
description = "AI Agent Platform NADA"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1,<1",
    "uvicorn[standard]>=0.52.1,<1",
    "sqlalchemy>=2.0.52,<3",
    "alembic>=1.19.1,<2",
    "agno>=2.8.7,<3",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.15.0,<3",
    "python-multipart>=0.0.32,<1",
    "python-jose[cryptography]>=3.5.0,<4",
    "passlib[argon2]>=1.7.4,<2",
    "python-dotenv>=1.2.2,<2",
    "sse-starlette>=3.4.8,<4",
    "aiosqlite>=0.22.1,<1",
    "asyncpg>=0.31.0",
    "openai>=2.54.0,<3",
    "anthropic>=0.121.0",
    "google-genai>=2.17.0",
    "ollama>=0.6.2",
    "mcp==1.29.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "httpx>=0.28.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]
